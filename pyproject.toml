[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ring-sandbox"
version = "0.5.0"
description = "Typed Python client and offline emulator for the Ring Partner API (api.amazonvision.com)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Joseph Mayo" }]
keywords = ["ring", "amazon", "amazonvision", "emulator", "sandbox", "webhooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Framework :: Pytest",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.7",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]
dev = [
  "ring-sandbox[server]",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
ring-sandbox = "ring_sandbox.cli:main"

[project.entry-points.pytest11]
ring_sandbox = "ring_sandbox.pytest_plugin"

[project.urls]
Homepage = "https://github.com/josepha-mayo/ring-sandbox"
Documentation = "https://developer.amazon.com/docs/ring/api-documentation.html"

[tool.hatch.build.targets.wheel]
only-include = ["src/ring_sandbox", "examples"]

[tool.hatch.build.targets.wheel.sources]
"src/ring_sandbox" = "ring_sandbox"
"examples" = "ring_sandbox/examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
